<script>
// Vista "Leads": cuántos leads entran, cuántos terminan comprando, cuánto facturan, cuánto tardan y de dónde
// vienen, con los filtros Fecha / Grupo / Local del tablero. Lee getLeads() ("leads_vista" de la Base comercial):
// solo cantidades por mes y local (por tipo de lead, calificación u origen), sin datos personales.
(function () {
  'use strict';

  var $ = function (id) { return document.getElementById(id); };
  var est = { datos: null, cargando: false, filtros: null };
  var graficos = {};

  var MESES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
  var nf1 = new Intl.NumberFormat('es-AR', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
  var nf0 = new Intl.NumberFormat('es-AR', { maximumFractionDigits: 0 });
  function pct(v) { return v == null || !isFinite(v) ? '–' : nf1.format(v * 100) + '%'; }
  function pct0(v) { return v == null || !isFinite(v) ? '–' : nf0.format(v * 100) + '%'; }
  function millones(v) { return '$' + nf1.format(v / 1e6) + ' M'; }
  function miles(v) { return v == null || !isFinite(v) ? '–' : '$' + nf0.format(v / 1000) + ' mil'; }
  function mesCorto(m) { var n = MESES[+m.slice(5, 7) - 1].slice(0, 3); return n.charAt(0).toUpperCase() + n.slice(1); }
  function mesLargo(m) { return MESES[+m.slice(5, 7) - 1] + ' ' + m.slice(0, 4); }
  function mesMenos12(m) { return (+m.slice(0, 4) - 1) + m.slice(4); }
  function css(v) { return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function mayus(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

  var CAMPOS = ['leads', 'compraron', 'facturacion', 'd0', 'd1_3', 'd4_7', 'd8_15', 'd16_30', 'd31_60', 'd61_90', 'dias_suma', 'mismo_local', 'no_concretaron', 'en_curso'];
  var TRAMOS = [['d0', 'Mismo día'], ['d1_3', '1 a 3 días'], ['d4_7', '4 a 7 días'], ['d8_15', '8 a 15 días'],
    ['d16_30', '16 a 30 días'], ['d31_60', '31 a 60 días'], ['d61_90', '61 a 90 días']];
  var TIPOS = [['nuevo', 'Nuevos'], ['ya_lead', 'Ya habían sido leads'], ['ya_cliente', 'Ya eran clientes']];
  var CALIF = [['Compro', 'Compró'], ['-', 'Sin calificar'], ['Presupuesto', 'Presupuesto'], ['No responde', 'No responde'], ['Error', 'Error']];
  // Semáforo de conversión (% de leads que compraron).
  var ESCALA = [
    { desde: 0.18, fondo: '#1f8a3b', texto: '#ffffff', lbl: '18% o más' },
    { desde: 0.12, fondo: '#8fd48f', texto: '#1a1a19', lbl: '12–18%' },
    { desde: 0.06, fondo: '#f7c948', texto: '#1a1a19', lbl: '6–12%' },
    { desde: -1, fondo: '#d03b3b', texto: '#ffffff', lbl: 'menos de 6%' }
  ];
  function colorConv(v) { return ESCALA.filter(function (e) { return v >= e.desde; })[0]; }

  // ---------- Vista ----------
  $('tab-leads').addEventListener('click', function () {
    ['vista-ventas', 'vista-comercial', 'vista-clientes', 'fuente', 'c-fuente', 'cl-fuente'].forEach(function (id) { $(id).hidden = true; });
    ['tab-ventas', 'tab-comercial', 'tab-clientes'].forEach(function (id) { $(id).setAttribute('aria-selected', 'false'); });
    $('tab-leads').setAttribute('aria-selected', 'true');
    $('vista-leads').hidden = false;
    $('l-fuente').hidden = !est.datos;
    document.querySelector('.campo-fecha').style.display = 'none'; // Leads: siempre el año en curso
    if (!est.datos && !est.cargando) cargar(); else if (est.datos) render();
  });
  ['tab-ventas', 'tab-comercial', 'tab-clientes'].forEach(function (id) {
    $(id).addEventListener('click', function () {
      $('vista-leads').hidden = true; $('l-fuente').hidden = true;
      document.querySelector('.campo-fecha').style.display = '';
      $('tab-leads').setAttribute('aria-selected', 'false');
    });
  });
  $('btn-actualizar').addEventListener('click', function () { if (!$('vista-leads').hidden && !est.cargando) cargar(); });
  document.addEventListener('definit:filtros', function (e) {
    est.filtros = e.detail;
    if (!$('vista-leads').hidden && est.datos) render();
  });

  function cargar() {
    est.cargando = true;
    var estado = $('l-estado');
    estado.hidden = false; estado.className = 'estado'; estado.textContent = 'Leyendo los leads…';
    google.script.run
      .withSuccessHandler(function (json) {
        est.cargando = false;
        var d = JSON.parse(json);
        if (d.sinAcceso || d.sinDatos) {
          estado.className = 'estado error';
          estado.textContent = d.sinAcceso
            ? 'Tu cuenta de Google no tiene acceso a la planilla "DEFINIT – Base comercial". Pedile acceso a quien administra el tablero.'
            : 'Todavía no hay datos de leads en la base comercial.';
          $('l-contenido').hidden = true;
          return;
        }
        est.datos = preparar(d.vista);
        var x = est.datos;
        $('l-fuente').textContent = 'Fuente: base de leads + ventas por ítem · leads de ' + mesLargo(x.meses[0]) + ' a ' + mesLargo(x.meses[x.meses.length - 1]) +
          ' · ventas ' + x.info.ventas.replace(/(\d{4})-(\d{2})-(\d{2})/g, '$3/$2/$1') + ' · sin datos personales: solo cantidades';
        $('l-fuente').hidden = $('vista-leads').hidden;
        estado.hidden = true;
        $('l-contenido').hidden = false;
        render();
      })
      .withFailureHandler(function (err) {
        est.cargando = false;
        estado.className = 'estado error';
        estado.textContent = 'No se pudieron leer los leads: ' + (err && err.message ? err.message : err);
      })
      .getLeads();
  }

  /** Filas de "leads_vista" (bloques A: tipo, B: calificación, C: origen) -> objetos. */
  function preparar(vista) {
    var enc = vista[0], datos = { A: [], B: [], C: [] }, meses = {}, info = { ventas: '', plazo: '', corte: '' };
    vista.slice(1).forEach(function (f) {
      if (f[0] === 'info') {
        info.ventas = String(f[1] || '').replace(/^ventas /, '');
        info.plazo = String(f[2] || '').replace(/^plazo /, '');
        info.corte = String(f[3] || '').replace(/^no concretó hasta /, '');
        return;
      }
      if (!datos[f[0]]) return;
      var o = { mes: String(f[1]), local: String(f[2]), clave: String(f[3]) };
      enc.slice(4).forEach(function (c, i) { o[c] = Number(f[i + 4]) || 0; });
      datos[f[0]].push(o); meses[o.mes] = true;
    });
    var m = info.ventas.match(/(\d{4}-\d{2})-\d{2} a (\d{4}-\d{2})/) || [];
    datos.meses = Object.keys(meses).sort();
    datos.info = info;
    datos.primeraVenta = m[1] || '2026-01';
    datos.ultimaVenta = m[2] || '9999-12';
    return datos;
  }

  // ---------- Datos ----------
  function enSeleccion(clave) {
    var f = est.filtros;
    if (!f) return clave !== '-';
    if (f.local) return clave === f.local;
    if (f.grupo === 'todos') return true;
    return f.clavesGrupo.indexOf(clave) >= 0;
  }
  function nombreLocal(clave) {
    var f = est.filtros;
    if (clave === '-') return 'Sin local';
    return (f && f.nombres && f.nombres[clave]) || mayus(clave);
  }
  function vacio() { var x = {}; CAMPOS.forEach(function (c) { x[c] = 0; }); return x; }
  function sumar(x, o) { CAMPOS.forEach(function (c) { x[c] += o[c] || 0; }); }
  /** Suma un bloque (A, B o C) en los meses dados y para el Grupo / Local elegidos; también agrupado. */
  function resumir(bloque, meses, porClave) {
    var tot = vacio(), grupos = {};
    est.datos[bloque].forEach(function (o) {
      if (meses.indexOf(o.mes) < 0 || !enSeleccion(o.local)) return;
      sumar(tot, o);
      if (porClave) { var k = porClave(o); sumar(grupos[k] = grupos[k] || vacio(), o); }
    });
    tot.grupos = grupos;
    return tot;
  }
  function conv(x) { return x && x.leads ? x.compraron / x.leads : null; }
  function en3(x) { return x && x.compraron ? (x.d0 + x.d1_3) / x.compraron : null; }

  // ---------- Render ----------
  function render() {
    var d = est.datos, f = est.filtros || {};
    var aviso = $('l-aviso'), avisos = [];
    // Leads no usa el filtro de Fecha: siempre el año en curso, de enero al último mes con ventas
    // (sin ventas no se puede saber quién compró). El mes que sigue, si ya tiene leads, figura en el gráfico mensual.
    var anio = d.ultimaVenta.slice(0, 4);
    var meses = d.meses.filter(function (m) { return m.slice(0, 4) === anio && m <= d.ultimaVenta; });
    var mv = meses.filter(function (m) { return m >= d.primeraVenta; });
    avisos.push('Año ' + anio + ': de ' + MESES[0] + ' a ' + (meses.length ? MESES[+meses[meses.length - 1].slice(5, 7) - 1] : '–') +
      ' (hasta el último mes con ventas para medir las compras). Esta pestaña no usa el filtro de Fecha.');
    if (!meses.length) {
      aviso.hidden = false; aviso.textContent = 'No hay leads en el período elegido.';
      $('l-kpis').innerHTML = ''; $('l-cuerpo').hidden = true;
      return;
    }
    $('l-cuerpo').hidden = false;
    if (mv.length < meses.length) avisos.push('Las compras se miden desde ' + mesLargo(d.primeraVenta) + ', cuando empiezan las ventas del archivo.');
    if (f.grupo !== 'propio') avisos.push('Las franquicias no están en el archivo de ventas: sus compras no se pueden medir.');
    aviso.hidden = !avisos.length; aviso.textContent = avisos.join(' ');

    var A = resumir('A', mv, function (o) { return o.clave; });          // por tipo
    var porLocal = resumir('A', mv, function (o) { return o.local; }).grupos;
    var porCalif = resumir('B', mv, function (o) { return o.clave; }).grupos;
    var porOrigen = resumir('C', mv, function (o) { return o.clave; }).grupos;
    var todos = resumir('A', meses), anterior = resumir('A', meses.map(mesMenos12));

    renderKpis(todos, A, anterior, meses);
    renderEmbudo(A, porCalif);
    renderDias(A);
    renderTipos(A);
    renderTendencia(meses);
    renderTablaCalif(porCalif);
    renderMesAMes(meses);
    renderTabla('l-t-origen', porOrigen, function (k) { return k; }, 15, 'Origen');
    renderTabla('l-t-local', porLocal, nombreLocal, 0, 'Local');
  }

  function renderKpis(todos, A, ant, meses) {
    var dif = ant.leads ? todos.leads / ant.leads - 1 : null;
    var nuevos = A.grupos.nuevo || vacio();
    var tiles = [
      { cls: 'hero', label: 'Leads', valor: nf0.format(todos.leads),
        det: dif == null ? 'Sin datos del año anterior' : '<span class="' + (dif >= 0 ? 'pos-var' : 'neg') + '">' + (dif >= 0 ? '+' : '−') + pct(Math.abs(dif)) + '</span> vs mismo período ' + (meses[0].slice(0, 4) - 1) },
      { label: 'Compraron', valor: pct(conv(A)), det: nf0.format(A.compraron) + ' de ' + nf0.format(A.leads) + ' leads (piso)' },
      { label: 'Facturación de los que compraron', valor: millones(A.facturacion), det: 'Ticket por comprador ' + miles(A.compraron ? A.facturacion / A.compraron : null) },
      { label: 'Compran en los primeros 3 días', valor: pct0(en3(A)), det: 'Promedio ' + nf1.format(A.compraron ? A.dias_suma / A.compraron : 0) + ' días hasta la compra' },
      { label: 'Compradores nuevos', valor: pct0(A.compraron ? nuevos.compraron / A.compraron : null), det: nf0.format(nuevos.compraron) + ' sin compras ni leads previos' }
    ];
    $('l-kpis').innerHTML = tiles.map(function (k) {
      return '<div class="kpi ' + (k.cls || '') + '"><div class="kpi-label">' + k.label + '</div><div class="kpi-valor">' + k.valor +
        '</div><div class="kpi-det">' + k.det + '</div></div>';
    }).join('');
  }

  function dibujar(id, config) {
    if (graficos[id]) graficos[id].destroy();
    graficos[id] = new Chart($(id), config);
  }
  function opciones() {
    var grid = css('--grid'), muted = css('--muted'), ink = css('--ink');
    return {
      responsive: true, maintainAspectRatio: false, animation: false,
      interaction: { mode: 'index', intersect: false },
      plugins: { legend: { display: false }, tooltip: { backgroundColor: css('--surface'), titleColor: ink, bodyColor: ink, borderColor: css('--axis'), borderWidth: 1, padding: 10 } },
      scales: {
        x: { grid: { display: false }, border: { color: css('--axis') }, ticks: { color: muted, maxRotation: 0, autoSkipPadding: 8 } },
        y: { grid: { color: grid }, border: { display: false }, ticks: { color: muted }, beginAtZero: true }
      }
    };
  }

  function renderEmbudo(A, porCalif) {
    var pre = porCalif.Presupuesto || vacio();
    var pasos = [['Leads', A.leads], ['Calificados "Presupuesto"', pre.leads], ['Compraron', A.compraron], ['No concretaron', A.no_concretaron], ['Todavía en curso', A.en_curso]];
    var colores = [css('--series-1'), '#2a78d6', '#1f8a3b', '#d03b3b', '#b7b8c0'];
    var op = opciones();
    op.indexAxis = 'y';
    op.scales.x.ticks.callback = function (v) { return nf0.format(v); };
    op.scales.x.grid = { color: css('--grid') }; op.scales.y.grid = { display: false };
    op.plugins.tooltip.callbacks = { label: function (ctx) { return ' ' + nf0.format(ctx.raw) + ' (' + pct(A.leads ? ctx.raw / A.leads : null) + ' de los leads)'; } };
    dibujar('l-ch-embudo', { type: 'bar', data: { labels: pasos.map(function (p) { return p[0]; }), datasets: [{ data: pasos.map(function (p) { return p[1]; }),
      backgroundColor: colores, maxBarThickness: 26, borderRadius: 4 }] }, options: op });
    $('l-n-embudo').innerHTML = 'De cada 100 leads, <strong>' + nf1.format((conv(A) || 0) * 100) + '</strong> compraron. "No concretaron" = sin compra pasado el plazo; "en curso" = todavía dentro del plazo.';
  }

  function renderDias(A) {
    var datos = TRAMOS.map(function (t) { return A.compraron ? A[t[0]] / A.compraron : 0; });
    var op = opciones();
    op.scales.y.ticks.callback = function (v) { return nf0.format(v * 100) + '%'; };
    op.plugins.tooltip.callbacks = { label: function (ctx) { return ' ' + pct(ctx.raw) + ' de los compradores (' + nf0.format(A[TRAMOS[ctx.dataIndex][0]]) + ')'; } };
    dibujar('l-ch-dias', { type: 'bar', data: { labels: TRAMOS.map(function (t) { return t[1]; }), datasets: [{ data: datos,
      backgroundColor: TRAMOS.map(function (t, i) { return i < 2 ? css('--series-1') : '#b3b3ff'; }), maxBarThickness: 40, borderRadius: { topLeft: 4, topRight: 4 }, borderSkipped: 'start' }] }, options: op });
    $('l-n-dias').innerHTML = 'El <strong>' + pct0(en3(A)) + '</strong> de los que compran lo hace en los primeros 3 días: la velocidad de respuesta define la venta.';
    $('l-t-dias').innerHTML = '<thead><tr><th class="izq">Cuándo compran</th><th>Compradores</th><th>%</th></tr></thead><tbody>' +
      TRAMOS.map(function (t) { return '<tr><td class="izq">' + t[1] + '</td><td>' + nf0.format(A[t[0]]) + '</td><td>' + pct0(A.compraron ? A[t[0]] / A.compraron : null) + '</td></tr>'; }).join('') + '</tbody>' +
      '<tfoot><tr><td class="izq">Total que compró</td><td>' + nf0.format(A.compraron) + '</td><td>' + (A.compraron ? '100%' : '–') + '</td></tr></tfoot>';
  }

  function renderTipos(A) {
    var g = A.grupos;
    var leads = TIPOS.map(function (t) { return (g[t[0]] || vacio()).leads; });
    var cv = TIPOS.map(function (t) { return conv(g[t[0]]); });
    var op = opciones();
    op.scales.y.ticks.callback = function (v) { return nf0.format(v); };
    op.scales.y2 = { position: 'right', grid: { display: false }, border: { display: false }, beginAtZero: true, ticks: { color: css('--muted'), callback: function (v) { return nf0.format(v * 100) + '%'; } } };
    op.plugins.tooltip.callbacks = { label: function (ctx) { return ctx.datasetIndex ? ' Compraron: ' + pct(ctx.raw) : ' Leads: ' + nf0.format(ctx.raw); } };
    dibujar('l-ch-tipos', { type: 'bar', data: { labels: TIPOS.map(function (t) { return t[1]; }), datasets: [
      { type: 'bar', data: leads, backgroundColor: '#b3b3ff', maxBarThickness: 48, borderRadius: { topLeft: 4, topRight: 4 }, borderSkipped: 'start', order: 2 },
      { type: 'line', data: cv, yAxisID: 'y2', borderColor: '#1f8a3b', backgroundColor: '#1f8a3b', pointRadius: 5, borderWidth: 2, order: 1 }
    ] }, options: op });
    $('l-leyenda-tipos').innerHTML = '<span><i class="caja" style="background:#b3b3ff"></i>Leads</span><span><i style="border-color:#1f8a3b"></i>% que compró</span>';
  }

  function renderTendencia(mesesSel) {
    var d = est.datos;
    var anio = mesesSel[mesesSel.length - 1].slice(0, 4);
    var meses = d.meses.filter(function (m) { return m.slice(0, 4) === anio; });
    var por = resumir('A', d.meses, function (o) { return o.mes; }).grupos;
    var leads = meses.map(function (m) { return (por[m] || vacio()).leads; });
    var ant = meses.map(function (m) { return (por[mesMenos12(m)] || vacio()).leads; });
    var cv = meses.map(function (m) { return m >= d.primeraVenta && m <= d.ultimaVenta ? conv(por[m]) : null; });
    var s1 = css('--series-1');
    var op = opciones();
    op.scales.y.ticks.callback = function (v) { return nf0.format(v); };
    op.scales.y2 = { position: 'right', grid: { display: false }, border: { display: false }, beginAtZero: true, ticks: { color: css('--muted'), callback: function (v) { return nf0.format(v * 100) + '%'; } } };
    op.plugins.tooltip.callbacks = { label: function (ctx) {
      if (ctx.raw == null) return null;
      return ctx.datasetIndex === 2 ? ' Compraron: ' + pct(ctx.raw) : ' ' + ctx.dataset.label + ': ' + nf0.format(ctx.raw);
    } };
    dibujar('l-ch-tendencia', { type: 'bar', data: { labels: meses.map(mesCorto), datasets: [
      // A la izquierda el año anterior (claro), a la derecha el año actual (oscuro).
      { type: 'bar', label: 'Leads ' + (anio - 1), data: ant, backgroundColor: '#b3b3ff', maxBarThickness: 22, order: 3 },
      { type: 'bar', label: 'Leads ' + anio, data: leads, backgroundColor: s1, maxBarThickness: 22, order: 4 },
      { type: 'line', label: '% compró', data: cv, yAxisID: 'y2', borderColor: '#1f8a3b', backgroundColor: '#1f8a3b', pointRadius: 4, borderWidth: 2, order: 1 }
    ] }, options: op });
    $('l-leyenda-tendencia').innerHTML = '<span><i class="caja" style="background:#b3b3ff"></i>Leads ' + (anio - 1) + '</span>' +
      '<span><i class="caja" style="background:' + s1 + '"></i>Leads ' + anio + '</span><span><i style="border-color:#1f8a3b"></i>% que compró</span>';
  }

  /** Mes a mes del año: leads (y contra el año anterior), compradores, % que compró, facturación y velocidad. */
  function renderMesAMes(meses) {
    var por = resumir('A', est.datos.meses, function (o) { return o.mes; }).grupos;
    var nuevos = resumir('A', est.datos.meses, function (o) { return o.mes + '|' + o.clave; }).grupos;
    var tot = vacio(), totAnt = 0, totNuevos = 0;
    var fila = function (nombre, x, ant, nv, total) {
      var dif = ant ? x.leads / ant - 1 : null;
      return '<tr><td class="izq">' + nombre + '</td><td>' + nf0.format(x.leads) + '</td>' +
        '<td class="' + (dif == null ? '' : dif >= 0 ? 'pos-var' : 'neg') + '">' + (dif == null ? '–' : (dif >= 0 ? '+' : '−') + pct0(Math.abs(dif))) + '</td>' +
        '<td>' + nf0.format(x.compraron) + '</td>' +
        '<td class="celda-seg"' + (!total && conv(x) != null ? ' style="background:' + colorConv(conv(x)).fondo + ';color:' + colorConv(conv(x)).texto + '"' : '') + '>' + pct(conv(x)) + '</td>' +
        '<td>' + millones(x.facturacion) + '</td><td>' + pct0(en3(x)) + '</td><td>' + pct0(x.compraron ? nv / x.compraron : null) + '</td></tr>';
    };
    var filas = meses.map(function (m) {
      var x = por[m] || vacio(), ant = (por[mesMenos12(m)] || vacio()).leads, nv = (nuevos[m + '|nuevo'] || vacio()).compraron;
      sumar(tot, x); totAnt += ant; totNuevos += nv;
      return fila(mayus(MESES[+m.slice(5, 7) - 1]), x, ant, nv);
    });
    $('l-t-mes').innerHTML = '<thead><tr><th class="izq">Mes</th><th>Leads</th><th>vs año anterior</th><th>Compraron</th><th>% compró</th>' +
      '<th>Facturación</th><th>Compra en 3 días</th><th>Compradores nuevos</th></tr></thead><tbody>' + filas.join('') + '</tbody>' +
      '<tfoot>' + fila('Total del año', tot, totAnt, totNuevos, true) + '</tfoot>';
  }

  function renderTablaCalif(porCalif) {
    $('l-t-calif').innerHTML = '<thead><tr><th class="izq">Calificación del equipo</th><th>Leads</th><th>Compraron</th><th>% compró</th><th>Compra en 3 días</th></tr></thead><tbody>' +
      CALIF.map(function (c) {
        var x = porCalif[c[0]] || vacio();
        return '<tr><td class="izq">' + c[1] + '</td><td>' + nf0.format(x.leads) + '</td><td>' + nf0.format(x.compraron) + '</td><td>' + pct(conv(x)) + '</td><td>' + pct0(en3(x)) + '</td></tr>';
      }).join('') + '</tbody>';
  }

  /** Tabla por origen o por local, con semáforo de conversión. */
  function renderTabla(id, grupos, nombre, maximo, titulo) {
    var claves = Object.keys(grupos).sort(function (a, b) { return grupos[b].leads - grupos[a].leads; });
    if (maximo) claves = claves.filter(function (k) { return k !== 'otros'; }).slice(0, maximo);
    var fila = function (n, x, total) {
      var c = conv(x), col = c == null ? null : colorConv(c);
      return '<tr><td class="izq">' + esc(n) + '</td><td>' + nf0.format(x.leads) + '</td><td>' + nf0.format(x.compraron) + '</td>' +
        '<td class="celda-seg"' + (col && !total ? ' style="background:' + col.fondo + ';color:' + col.texto + '"' : '') + '>' + pct(c) + '</td>' +
        '<td>' + millones(x.facturacion) + '</td><td>' + miles(x.compraron ? x.facturacion / x.compraron : null) + '</td>' +
        '<td>' + pct0(en3(x)) + '</td><td>' + nf0.format(x.no_concretaron) + '</td><td>' + nf0.format(x.en_curso) + '</td></tr>';
    };
    var tot = vacio(); claves.forEach(function (k) { sumar(tot, grupos[k]); });
    $(id).innerHTML = '<thead><tr><th class="izq">' + titulo + '</th><th>Leads</th><th>Compraron</th><th>% compró</th>' +
      '<th>Facturación</th><th>Ticket</th><th>Compra en 3 días</th><th>No concretaron</th><th>En curso</th></tr></thead><tbody>' +
      claves.map(function (k) { return fila(nombre(k), grupos[k]); }).join('') + '</tbody><tfoot>' +
      fila(maximo ? 'Total de estos ' + claves.length : 'Total', tot, true) + '</tfoot>';
  }

  $('l-escala').innerHTML = '<span style="margin-right:6px">% compró:</span>' + ESCALA.map(function (e) {
    return '<span style="display:inline-flex;align-items:center;gap:4px;margin-right:8px"><i style="background:' + e.fondo + '"></i>' + e.lbl + '</span>';
  }).join('');
})();
</script>
