<script>
// Vista "Leads": cantidad, calificación y origen de los leads con los filtros Fecha / Grupo / Local del
// tablero, la curva de leads contra la de venta (para ver el "hockey stick" de los dos) y el control
// de seguimiento por local. Lee getLeads() (planilla "DEFINIT – Base comercial", sin datos personales).
(function () {
  'use strict';

  var $ = function (id) { return document.getElementById(id); };
  var est = { datos: null, cargando: false, filtros: null };
  var graficos = {};

  var nf1 = new Intl.NumberFormat('es-AR', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
  var nf0 = new Intl.NumberFormat('es-AR', { maximumFractionDigits: 0 });
  function pct(v) { return v == null || !isFinite(v) ? '–' : nf1.format(v * 100) + '%'; }
  function css(v) { return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function fechaCorta(iso) { return +iso.slice(8, 10) + '/' + +iso.slice(5, 7); }
  function fechaLarga(iso) { return iso.slice(8, 10) + '/' + iso.slice(5, 7) + '/' + iso.slice(0, 4); }
  function isoAUTC(iso) { return Date.UTC(+iso.slice(0, 4), +iso.slice(5, 7) - 1, +iso.slice(8, 10)); }
  function utcAIso(t) { var x = new Date(t); return x.getUTCFullYear() + '-' + ('0' + (x.getUTCMonth() + 1)).slice(-2) + '-' + ('0' + x.getUTCDate()).slice(-2); }
  function sumarDias(iso, n) { return utcAIso(isoAUTC(iso) + n * 864e5); }
  function dias(a, b) { return Math.round((isoAUTC(b) - isoAUTC(a)) / 864e5) + 1; }
  function mayus(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

  // Calificaciones del sistema de leads, en el orden en que se apilan.
  var CALIF = [
    { id: 'Compro', txt: 'Compró', color: '#1f8a3b' },
    { id: 'Presupuesto', txt: 'Presupuesto', color: '#2a78d6' },
    { id: 'No responde', txt: 'No responde', color: '#b7b8c0' },
    { id: 'Error', txt: 'Error', color: '#d03b3b' },
    { id: '-', txt: 'Sin calificar', color: '#e6e6ef' }
  ];
  function califDe(r) { return CALIF.some(function (c) { return c.id === r; }) ? r : (r && r !== '-' ? 'Presupuesto' : '-'); }

  // Semáforo de seguimiento: % de leads calificados.
  var ESCALA = [
    { desde: 0.8, fondo: '#1f8a3b', texto: '#ffffff', lbl: '80% o más' },
    { desde: 0.6, fondo: '#f7c948', texto: '#1a1a19', lbl: '60–80%' },
    { desde: 0.4, fondo: '#f08a3c', texto: '#1a1a19', lbl: '40–60%' },
    { desde: -1, fondo: '#d03b3b', texto: '#ffffff', lbl: 'menos de 40%' }
  ];
  function colorSeg(v) { return ESCALA.filter(function (e) { return v >= e.desde; })[0]; }

  // ---------- Vista ----------
  $('tab-leads').addEventListener('click', function () {
    ['vista-ventas', 'vista-comercial', 'vista-clientes', 'fuente', 'c-fuente', 'cl-fuente'].forEach(function (id) { $(id).hidden = true; });
    ['tab-ventas', 'tab-comercial', 'tab-clientes'].forEach(function (id) { $(id).setAttribute('aria-selected', 'false'); });
    $('tab-leads').setAttribute('aria-selected', 'true');
    $('vista-leads').hidden = false;
    $('l-fuente').hidden = !est.datos;
    if (!est.datos && !est.cargando) cargar(); else if (est.datos) render();
  });
  // Al pasar a otra vista, esta se oculta.
  ['tab-ventas', 'tab-comercial', 'tab-clientes'].forEach(function (id) {
    $(id).addEventListener('click', function () {
      $('vista-leads').hidden = true; $('l-fuente').hidden = true;
      $('tab-leads').setAttribute('aria-selected', 'false');
    });
  });
  $('btn-actualizar').addEventListener('click', function () { if (!$('vista-leads').hidden && !est.cargando) cargar(); });
  document.addEventListener('definit:filtros', function (e) {
    est.filtros = e.detail;
    if (!$('vista-leads').hidden && est.datos) render();
  });

  function cargar() {
    est.cargando = true;
    var estado = $('l-estado');
    estado.hidden = false; estado.className = 'estado'; estado.textContent = 'Leyendo los leads…';
    google.script.run
      .withSuccessHandler(function (json) {
        est.cargando = false;
        var d = JSON.parse(json);
        if (d.sinAcceso || d.sinDatos) {
          estado.className = 'estado error';
          estado.textContent = d.sinAcceso
            ? 'Tu cuenta de Google no tiene acceso a la planilla "DEFINIT – Base comercial". Pedile acceso a quien administra el tablero.'
            : 'Todavía no hay leads cargados: el Excel de leads tiene que estar en la carpeta de los archivos del cierre (lo procesa el procesador comercial, dentro de la hora).';
          $('l-contenido').hidden = true;
          return;
        }
        d.desde = d.filas.reduce(function (m, f) { return !m || f[0] < m ? f[0] : m; }, null);
        d.hasta = d.filas.reduce(function (m, f) { return !m || f[0] > m ? f[0] : m; }, null);
        est.datos = d;
        $('l-fuente').textContent = 'Fuente: ' + d.archivo + (d.actualizadoArchivo ? ' · actualizado ' + String(d.actualizadoArchivo).slice(0, 16).replace(/^(\d{4})-(\d{2})-(\d{2})/, '$3/$2/$1') + ' h' : '') +
          ' · datos del ' + fechaLarga(d.desde) + ' al ' + fechaLarga(d.hasta) + ' · sin datos personales: solo cantidades';
        $('l-fuente').hidden = $('vista-leads').hidden;
        estado.hidden = true;
        $('l-contenido').hidden = false;
        render();
      })
      .withFailureHandler(function (err) {
        est.cargando = false;
        estado.className = 'estado error';
        estado.textContent = 'No se pudieron leer los leads: ' + (err && err.message ? err.message : err);
      })
      .getLeads();
  }

  // ---------- Datos ----------
  /** ¿El local (clave de Facturación) entra en el Grupo / Local elegidos arriba? */
  function enSeleccion(clave) {
    var f = est.filtros;
    if (!f) return true;
    if (f.local) return clave === f.local;
    if (f.grupo === 'todos') return true;
    return f.clavesGrupo.indexOf(clave) >= 0;
  }

  function nombreLocal(clave) {
    var f = est.filtros;
    return (f && f.nombres && f.nombres[clave]) || mayus(clave);
  }

  /** Suma de leads de un rango de días: total, por calificación, por local y por origen. */
  function resumir(ini, fin) {
    var r = { total: 0, calif: {}, porLocal: {}, porOrigen: {}, porDia: {} };
    est.datos.filas.forEach(function (x) {
      if (x[0] < ini || x[0] > fin || !enSeleccion(x[1])) return;
      var n = x[4], c = califDe(x[3]);
      r.total += n;
      r.calif[c] = (r.calif[c] || 0) + n;
      var l = r.porLocal[x[1]] = r.porLocal[x[1]] || { total: 0, calif: {} };
      l.total += n; l.calif[c] = (l.calif[c] || 0) + n;
      var o = r.porOrigen[x[2]] = r.porOrigen[x[2]] || { total: 0, calif: {} };
      o.total += n; o.calif[c] = (o.calif[c] || 0) + n;
      r.porDia[x[0]] = (r.porDia[x[0]] || 0) + n;
    });
    return r;
  }
  function calificados(x) { return x.total - (x.calif['-'] || 0); }
  function pctCompro(x) { var q = calificados(x); return q ? (x.calif.Compro || 0) / q : null; }

  // ---------- Render ----------
  function render() {
    var d = est.datos, f = est.filtros || {};
    var aviso = $('l-aviso'), avisos = [];
    var ini = f.ini || d.desde, fin = f.fin || d.hasta;
    // Solo los días que tiene el archivo de leads.
    var a = ini < d.desde ? d.desde : ini, b = fin > d.hasta ? d.hasta : fin;
    if (a > b) {
      aviso.hidden = false;
      aviso.textContent = 'El archivo de leads va del ' + fechaLarga(d.desde) + ' al ' + fechaLarga(d.hasta) + ': no hay leads en el período elegido.';
      $('l-kpis').innerHTML = ''; $('l-graficos').hidden = true; $('l-panel-tabla').hidden = true;
      return;
    }
    $('l-graficos').hidden = false; $('l-panel-tabla').hidden = false;
    if (a !== ini || b !== fin) avisos.push('El archivo de leads va del ' + fechaLarga(d.desde) + ' al ' + fechaLarga(d.hasta) + ': se muestra del ' + fechaLarga(a) + ' al ' + fechaLarga(b) + '.');
    if (f.grupo === 'franquicia' || f.grupo === 'todos') avisos.push('Las franquicias no califican los leads en el sistema: su % de calificados y de "Compró" no es comparable con el de los propios.');
    aviso.hidden = !avisos.length; aviso.textContent = avisos.join(' ');

    var r = resumir(a, b);
    var n = dias(a, b), pa = sumarDias(a, -n), pb = sumarDias(a, -1);
    var previo = pa >= d.desde ? resumir(pa, pb) : null;
    renderKpis(r, previo);
    renderCurva(r, a, b);
    renderOrigen(r);
    renderTabla(r);
  }

  function delta(v, ant, esPts) {
    if (ant == null || v == null || !isFinite(v) || !isFinite(ant)) return '';
    var dif = esPts ? (v - ant) * 100 : (ant ? v / ant - 1 : null);
    if (dif == null) return '';
    var txt = esPts ? (dif >= 0 ? '+' : '−') + nf1.format(Math.abs(dif)) + ' pts' : (dif >= 0 ? '+' : '−') + pct(Math.abs(dif));
    return '<span class="' + (dif >= 0 ? 'pos' : 'neg') + '">' + txt + '</span> vs período anterior';
  }

  function renderKpis(r, p) {
    var q = calificados(r), qp = p ? calificados(p) : null;
    var tiles = [
      { cls: 'hero', label: 'Leads', valor: nf0.format(r.total), det: delta(r.total, p && p.total) || 'Sin período anterior en el archivo' },
      { label: 'Leads calificados', valor: pct(r.total ? q / r.total : null), det: nf0.format(q) + ' con seguimiento · ' + (delta(r.total ? q / r.total : null, p && p.total ? qp / p.total : null, true) || '') },
      { label: 'Compraron', valor: pct(pctCompro(r)), det: nf0.format(r.calif.Compro || 0) + ' leads · sobre los calificados' },
      { label: 'Presupuesto enviado', valor: pct(q ? (r.calif.Presupuesto || 0) / q : null), det: nf0.format(r.calif.Presupuesto || 0) + ' leads · sobre los calificados' },
      { label: 'No responde', valor: pct(q ? (r.calif['No responde'] || 0) / q : null), det: nf0.format(r.calif['No responde'] || 0) + ' leads · sobre los calificados' }
    ];
    $('l-kpis').innerHTML = tiles.map(function (k) {
      return '<div class="kpi ' + (k.cls || '') + '"><div class="kpi-label">' + k.label + '</div><div class="kpi-valor">' + k.valor +
        '</div><div class="kpi-det">' + k.det + '</div></div>';
    }).join('');
  }

  function dibujar(id, config) {
    if (graficos[id]) graficos[id].destroy();
    graficos[id] = new Chart($(id), config);
  }

  /** Avance acumulado (% del total del período) de leads y de venta, día a día, contra el ritmo parejo. */
  function renderCurva(r, a, b) {
    var f = est.filtros || {};
    var venta = {};
    (f.ventaDiaria || []).forEach(function (p) { venta[p[0]] = p[1]; });
    var fechas = [];
    for (var x = a; x <= b; x = sumarDias(x, 1)) fechas.push(x);
    var totV = fechas.reduce(function (s, x) { return s + (venta[x] || 0); }, 0);
    var accL = 0, accV = 0;
    var serieL = fechas.map(function (x) { accL += r.porDia[x] || 0; return r.total ? accL / r.total : null; });
    var serieV = fechas.map(function (x) { accV += venta[x] || 0; return totV ? accV / totV : null; });
    var parejo = fechas.map(function (x, i) { return (i + 1) / fechas.length; });
    var s1 = css('--series-1'), lead = '#1baf7a', aviso = css('--warning');

    dibujar('l-ch-curva', {
      type: 'line',
      data: { labels: fechas.map(fechaCorta), datasets: [
        { label: 'Leads', data: serieL, borderColor: lead, borderWidth: 2, pointRadius: 0, pointHoverRadius: 4, fill: false },
        { label: 'Venta', data: totV ? serieV : [], borderColor: s1, borderWidth: 2, pointRadius: 0, pointHoverRadius: 4, fill: false },
        { label: 'Ritmo parejo', data: parejo, borderColor: aviso, borderWidth: 1.5, borderDash: [6, 4], pointRadius: 0, pointHoverRadius: 0, fill: false }
      ] },
      options: opciones(function (v) { return nf0.format(v * 100) + '%'; }, function (ctx) { return ' ' + ctx.dataset.label + ': ' + pct(ctx.raw) + ' del período'; })
    });
    $('l-leyenda-curva').innerHTML =
      '<span><i style="border-color:' + lead + '"></i>Leads acumulados</span>' +
      (totV ? '<span><i style="border-color:' + s1 + '"></i>Venta acumulada</span>' : '') +
      '<span><i class="punteada" style="border-color:' + aviso + '"></i>Ritmo parejo</span>';

    // Últimos 7 días del período: qué parte de los leads y de la venta cayó ahí.
    var k = Math.min(7, fechas.length), corte = fechas[fechas.length - k];
    var finL = 0, finV = 0;
    fechas.forEach(function (x) { if (x >= corte) { finL += r.porDia[x] || 0; finV += venta[x] || 0; } });
    $('l-n-curva').innerHTML = 'Cada línea es el % del total del período acumulado día a día. Si se curvan hacia abajo y suben al final, hay "hockey stick".' +
      (fechas.length > 7 ? '<br>Últimos 7 días: <strong>' + pct(r.total ? finL / r.total : null) + ' de los leads</strong>' +
        (totV ? ' y <strong>' + pct(finV / totV) + ' de la venta</strong>' : '') + ' (parejo ≈ ' + pct(k / fechas.length) + ')' : '');
  }

  function opciones(ticks, label) {
    var grid = css('--grid'), muted = css('--muted'), ink = css('--ink');
    return {
      responsive: true, maintainAspectRatio: false, animation: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { display: false },
        tooltip: { backgroundColor: css('--surface'), titleColor: ink, bodyColor: ink, borderColor: css('--axis'), borderWidth: 1, padding: 10,
          callbacks: { label: label }, filter: function (i) { return i.raw != null; } }
      },
      scales: {
        x: { grid: { display: false }, border: { color: css('--axis') }, ticks: { color: muted, maxRotation: 0, autoSkipPadding: 10 } },
        y: { grid: { color: grid }, border: { display: false }, ticks: { color: muted, callback: ticks }, beginAtZero: true }
      }
    };
  }

  /** Los 10 orígenes con más leads, apilados por calificación. */
  function renderOrigen(r) {
    var top = Object.keys(r.porOrigen).map(function (o) { return { o: o, x: r.porOrigen[o] }; })
      .sort(function (a, b) { return b.x.total - a.x.total; }).slice(0, 10);
    var op = opciones(function (v) { return nf0.format(v); }, function (ctx) {
      return ctx.raw ? ' ' + ctx.dataset.label + ': ' + nf0.format(ctx.raw) : null;
    });
    op.indexAxis = 'y';
    op.interaction = { mode: 'index', axis: 'y', intersect: false };
    op.scales.x.stacked = op.scales.y.stacked = true;
    op.scales.x.ticks.callback = function (v) { return nf0.format(v); };
    op.scales.y.ticks.callback = function (v, i) { var t = top[i].o; return t.length > 28 ? t.slice(0, 27) + '…' : t; };
    op.scales.x.grid = { color: css('--grid') }; op.scales.y.grid = { display: false };
    op.plugins.tooltip.callbacks.afterBody = function (items) {
      var x = top[items[0].dataIndex].x;
      return ['', 'Compró: ' + pct(pctCompro(x)) + ' de los calificados'];
    };
    dibujar('l-ch-origen', { type: 'bar', data: { labels: top.map(function (t) { return t.o; }), datasets: CALIF.map(function (c) {
      return { label: c.txt, data: top.map(function (t) { return t.x.calif[c.id] || 0; }), backgroundColor: c.color, maxBarThickness: 18 };
    }) }, options: op });
    $('l-leyenda-origen').innerHTML = CALIF.map(function (c) { return '<span><i class="caja" style="background:' + c.color + '"></i>' + c.txt + '</span>'; }).join('');
  }

  /** Control de seguimiento: por local, leads y % calificados con semáforo. */
  function renderTabla(r) {
    var locs = Object.keys(r.porLocal).sort(function (a, b) { return r.porLocal[b].total - r.porLocal[a].total; });
    var fila = function (nombre, x, total) {
      var q = calificados(x), p = x.total ? q / x.total : null, col = p == null ? null : colorSeg(p);
      return '<tr' + (total ? '' : '') + '><td class="izq">' + esc(nombre) + '</td><td>' + nf0.format(x.total) + '</td>' +
        '<td class="celda-seg"' + (col ? ' style="background:' + col.fondo + ';color:' + col.texto + '"' : '') + '>' + pct(p) + '</td>' +
        '<td>' + nf0.format(x.calif.Compro || 0) + '</td><td>' + pct(pctCompro(x)) + '</td>' +
        '<td>' + nf0.format(x.calif.Presupuesto || 0) + '</td><td>' + nf0.format(x.calif['No responde'] || 0) + '</td>' +
        '<td>' + nf0.format(x.calif.Error || 0) + '</td><td>' + nf0.format(x.calif['-'] || 0) + '</td></tr>';
    };
    $('l-tabla').innerHTML = '<thead><tr><th class="izq">Local</th><th>Leads</th><th>% calificados</th><th>Compró</th><th>% Compró</th>' +
      '<th>Presupuesto</th><th>No responde</th><th>Error</th><th>Sin calificar</th></tr></thead><tbody>' +
      locs.map(function (l) { return fila(nombreLocal(l), r.porLocal[l]); }).join('') + '</tbody>' +
      '<tfoot>' + fila('Total', r, true) + '</tfoot>';
    $('l-escala').innerHTML = '<span style="margin-right:6px">% calificados:</span>' + ESCALA.map(function (e) {
      return '<span style="display:inline-flex;align-items:center;gap:4px;margin-right:8px"><i style="background:' + e.fondo + '"></i>' + e.lbl + '</span>';
    }).join('');
  }
})();
</script>
