<style>
  :root {
    color-scheme: light;
    --brand: #0000ff;
    --brand-ink: #ffffff;
    --page: #f5f5f7;
    --surface: #ffffff;
    --ink: #272727;
    --ink-2: #52514e;
    --muted: #898781;
    --grid: #e1e0d9;
    --axis: #c3c2b7;
    --border: rgba(11, 11, 11, 0.10);
    --series-1: #0000ff;
    --series-1-wash: rgba(0, 0, 255, 0.07);
    --ref: #52514e;
    --good: #0ca30c;
    --good-text: #006300;
    --warning: #fab219;
    --critical: #d03b3b;
    --critical-text: #b42f2f;
    --neutral: #f0efec;
    --track: #d9d9ff;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --brand: #5c5cff;
      --brand-ink: #ffffff;
      --page: #0d0d0d;
      --surface: #1a1a19;
      --ink: #ffffff;
      --ink-2: #c3c2b7;
      --muted: #898781;
      --grid: #2c2c2a;
      --axis: #383835;
      --border: rgba(255, 255, 255, 0.10);
      --series-1: #5c5cff;
      --series-1-wash: rgba(92, 92, 255, 0.14);
      --ref: #c3c2b7;
      --good-text: #0ca30c;
      --critical-text: #e66767;
      --neutral: #383835;
      --track: #23234d;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --brand: #5c5cff;
    --brand-ink: #ffffff;
    --page: #0d0d0d;
    --surface: #1a1a19;
    --ink: #ffffff;
    --ink-2: #c3c2b7;
    --muted: #898781;
    --grid: #2c2c2a;
    --axis: #383835;
    --border: rgba(255, 255, 255, 0.10);
    --series-1: #5c5cff;
    --series-1-wash: rgba(92, 92, 255, 0.14);
    --ref: #c3c2b7;
    --good-text: #0ca30c;
    --critical-text: #e66767;
    --neutral: #383835;
    --track: #23234d;
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0;
    background: var(--page);
    color: var(--ink);
    font: 14px/1.45 Montserrat, system-ui, -apple-system, "Segoe UI", sans-serif;
    padding: 20px 24px 48px;
    max-width: 1320px;
    margin-inline: auto;
  }
  h1 { font-size: 24px; margin: 0; font-weight: 600; letter-spacing: -0.01em; }
  h2 { font-size: 15px; margin: 0; font-weight: 600; }
  .sub, .nota { color: var(--ink-2); margin: 2px 0 0; font-size: 13px; }
  .nota { font-size: 12.5px; }

  .marca {
    display: flex; justify-content: space-between; align-items: center; gap: 16px;
    background: var(--surface); margin: -20px -24px 20px; padding: 14px 24px;
    box-shadow: 0 1px 0 var(--border), 0 2px 10px rgba(0, 0, 0, 0.05);
  }
  .marca-logo { display: inline-flex; color: var(--ink); }
  .logo { height: 44px; width: auto; display: block; }
  .logo-circulo { fill: #0000ff; }
  .titulo { margin-bottom: 16px; }
  .btn {
    font: inherit; font-weight: 600; color: var(--brand-ink); background: var(--brand);
    border: 0; border-radius: 6px; padding: 9px 18px; cursor: pointer;
  }
  .btn:hover { filter: brightness(1.15); }
  .btn:disabled { opacity: 0.6; cursor: progress; }

  .filtros {
    display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: flex-end;
    padding: 12px 14px; background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; margin-bottom: 16px;
  }
  .campo { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--ink-2); }
  select {
    font: inherit; font-size: 14px; color: var(--ink); background: var(--page);
    border: 1px solid var(--border); border-radius: 8px; padding: 6px 8px; min-width: 170px;
  }
  .segmentado { display: inline-flex; background: var(--page); border: 1px solid var(--border); border-radius: 8px; padding: 2px; }
  .segmentado button {
    font: inherit; font-size: 13.5px; color: var(--ink-2); background: none; border: 0;
    border-radius: 6px; padding: 5px 12px; cursor: pointer;
  }
  .segmentado button[aria-checked="true"] { background: var(--brand); color: var(--brand-ink); font-weight: 600; }
  select:focus-visible, .segmentado button:focus-visible, .btn:focus-visible, th[data-orden]:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }

  .estado { color: var(--ink-2); padding: 40px 0; text-align: center; }
  .estado.error { color: var(--critical-text); }

  .kpis { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; margin-bottom: 16px; }
  .kpi { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; min-width: 0; }
  .kpi-label { font-size: 12.5px; color: var(--ink-2); }
  .kpi-valor { font-size: 26px; font-weight: 600; margin-top: 4px; letter-spacing: -0.01em; white-space: nowrap; }
  .kpi.hero { border-top: 3px solid var(--brand); }
  .kpi.hero .kpi-valor { font-size: 30px; }
  .kpi-det { font-size: 12.5px; color: var(--ink-2); margin-top: 2px; }
  .medidor { height: 6px; border-radius: 3px; background: var(--track); margin-top: 10px; position: relative; overflow: visible; }
  .medidor > i { position: absolute; inset: 0 auto 0 0; border-radius: 3px; background: var(--series-1); max-width: 100%; }
  .medidor > b { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--ink); border-radius: 1px; }

  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 16px; min-width: 0; }
  .panel-head { margin-bottom: 10px; }
  .panel-head-fila { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px 20px; flex-wrap: wrap; }
  .grid-2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }
  .grid-2 .panel { margin-bottom: 16px; }
  .chart { position: relative; height: 260px; }
  .chart-alto { height: 300px; }

  .leyenda { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12.5px; color: var(--ink-2); margin-bottom: 8px; }
  .leyenda span { display: inline-flex; align-items: center; gap: 6px; }
  .leyenda i { display: inline-block; width: 14px; height: 0; border-top: 2px solid; }
  .leyenda i.punteada { border-top-style: dashed; }
  .leyenda i.caja { height: 10px; border: 0; border-radius: 2px; }

  .tabla-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
  th, td { padding: 7px 10px; text-align: right; white-space: nowrap; }
  th { font-size: 12px; font-weight: 600; color: var(--ink-2); border-bottom: 1px solid var(--axis); }
  th:first-child, td:first-child, th.izq, td.izq { text-align: left; }
  .ranking td { border-bottom: 1px solid var(--grid); }
  .ranking tbody tr:hover { background: var(--page); }
  .ranking th[data-orden] { cursor: pointer; user-select: none; }
  .ranking th[data-orden]:hover { color: var(--ink); }
  .ranking th[aria-sort="descending"]::after { content: " ↓"; }
  .ranking th[aria-sort="ascending"]::after { content: " ↑"; }
  .ranking tfoot td { font-weight: 650; border-top: 1px solid var(--axis); border-bottom: 0; }
  .pos { color: var(--muted); width: 28px; }
  .barra-celda { display: flex; align-items: center; gap: 8px; justify-content: flex-end; }
  .barra { width: 80px; height: 6px; border-radius: 3px; background: var(--track); position: relative; flex: none; }
  .barra > i { position: absolute; inset: 0 auto 0 0; border-radius: 3px; background: var(--series-1); }
  .barra > b { position: absolute; top: -3px; bottom: -3px; left: calc(80px / 1.5 - 1px); width: 2px; background: var(--ink); }
  .chip { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 550; color: var(--ink); }
  .chip i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .neg { color: var(--critical-text); }

  .mapa td, .mapa th { padding: 5px 6px; font-size: 12.5px; }
  .mapa td.celda { min-width: 64px; text-align: center; border: 2px solid var(--surface); border-radius: 4px; cursor: default; }
  .mapa th.en-curso { color: var(--ink); }
  .escala { display: flex; align-items: center; gap: 4px; font-size: 12px; color: var(--ink-2); margin-bottom: 8px; flex-wrap: wrap; }
  .escala i { width: 28px; height: 10px; display: inline-block; border-radius: 2px; }

  .tooltip {
    position: fixed; z-index: 10; pointer-events: none; background: var(--surface); color: var(--ink);
    border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font-size: 12.5px;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12); max-width: 260px;
  }
  .tooltip strong { display: block; margin-bottom: 2px; }

  @media (max-width: 1100px) { .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  @media (max-width: 860px) { .grid-2 { grid-template-columns: minmax(0, 1fr); } }
  @media (max-width: 600px) {
    body { padding: 14px 16px 40px; }
    .marca { margin: -14px -16px 16px; padding: 10px 16px; }
    .logo { height: 34px; }
    h1 { font-size: 19px; }
    .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .kpi.hero { grid-column: 1 / -1; }
    .kpi-valor { font-size: 21px; }
    select { min-width: 0; width: 100%; }
    .campo { flex: 1 1 140px; }
    .chart { height: 220px; }
  }
</style>
