# Publica el tablero en Google Apps Script en cada push a main que toque src/.
#
# Necesita el secret CLASPRC_JSON (Settings → Secrets and variables → Actions):
# el contenido de ~/.clasprc.json después de `npx clasp login`.
# Además usa .clasp.json (ID del script) y DEPLOYMENT_ID (abajo), que no son
# secretos: el ID de implementación es parte de la URL pública del tablero.
#
# Actualiza siempre la MISMA implementación, así la URL del tablero no cambia.
name: Publicar tablero

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - '.clasp.json'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

env:
  # ID de la implementación web (npx clasp deployments, el que no dice @HEAD).
  DEPLOYMENT_ID: AKfycbwadhCyR2cirZ-wKxHdEAArIu2xZPN7maaCrI5kQi64YLSG_fgDNEnw6XSe942mSBjYVA

concurrency:
  group: publicar-tablero
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verificar configuración
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          falta=0
          [ -f .clasp.json ] || { echo "::error::Falta .clasp.json en el repo (ver README, paso 3)."; falta=1; }
          [ -n "$CLASPRC_JSON" ] || { echo "::error::Falta el secret CLASPRC_JSON (ver README)."; falta=1; }
          exit $falta

      - name: Probar el parser
        run: node -e "require('./src/Parser.js')"

      - name: Instalar clasp
        run: npm install -g @google/clasp@2.5.0

      - name: Subir código a Apps Script
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          printf '%s' "$CLASPRC_JSON" > ~/.clasprc.json
          chmod 600 ~/.clasprc.json
          clasp push --force

      - name: Actualizar la implementación web
        run: |
          if ! clasp deploy --deploymentId "$DEPLOYMENT_ID" --description "GitHub ${GITHUB_SHA::7}" > salida.txt 2>&1; then
            cat salida.txt
            echo "::error::clasp deploy falló: $(tr '\n' ' ' < salida.txt | tail -c 400)"
            exit 1
          fi
          cat salida.txt

      - name: Borrar credenciales
        if: always()
        run: rm -f ~/.clasprc.json
